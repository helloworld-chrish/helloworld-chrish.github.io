<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Chris H. — 攝影作品集</title>
<meta name="description" content="Chris H.，生長於台灣的攝影師。作品集。">
<link rel="canonical" href="https://helloworld-chrish.github.io/">

<meta property="og:type" content="website">
<meta property="og:title" content="Chris H. — 攝影作品集">
<meta property="og:description" content="Chris H.，生長於台灣的攝影師。作品集。">
<meta property="og:url" content="https://helloworld-chrish.github.io/">
<meta property="og:image" content="https://helloworld-chrish.github.io/photos/dscf1825-mu3ve3r30yy.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23f4f3f1'/%3E%3Crect x='30' y='30' width='18' height='40' fill='%231a1a19'/%3E%3Crect x='54' y='30' width='18' height='26' fill='%23a05a45'/%3E%3C/svg%3E">

<link rel="preload" href="assets/fonts/ibm-plex-mono-latin-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/style.css">

<!-- Kick the photo list off during HTML parse. Without this it can only
     start after app.js has downloaded and run — a whole round trip that
     every image then waits on. -->
<script>
  window.__photos = fetch('data/photos.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  // app.js does the real error handling; this just keeps an early
  // network failure from logging as an unhandled rejection.
  window.__photos.catch(function () {});
</script>
</head>

<body>

<section class="hero" id="hero">
  <span class="hero__name" id="heroName">Chris H.</span>
  <button class="hero__about" id="aboutBtn" type="button">ABOUT</button>
  <img class="hero__img" id="heroImg" src="photos/dscf1825-mu3ve3r30yy.jpg" alt="" fetchpriority="high" decoding="async">
</section>

<div class="sheet">
  <div class="rail">
    <div class="gallery" id="gallery"></div>
    <noscript>
      <div class="empty">這個作品集需要 JavaScript 才能顯示照片。</div>
    </noscript>
  </div>

  <footer>
    <span class="name" id="footName">CHRIS H.</span>
    <span>© <span id="year">2026</span> ALL RIGHTS RESERVED</span>
  </footer>
</div>

<!-- lightbox -->
<div class="overlay lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="照片檢視" hidden>
  <div class="overlay__panel" id="lbPanel">
    <img id="lbImg" src="" alt="">
    <p class="lightbox__caption" id="lbCaption"></p>
  </div>
  <button class="lightbox__nav lightbox__nav--prev" id="lbPrev" type="button" aria-label="上一張">‹</button>
  <button class="lightbox__nav lightbox__nav--next" id="lbNext" type="button" aria-label="下一張">›</button>
  <button class="overlay__close" id="lbClose" type="button">CLOSE</button>
</div>

<!-- about -->
<div class="overlay about" id="about" role="dialog" aria-modal="true" aria-label="關於" hidden>
  <div class="overlay__panel" id="aboutPanel">
    <div class="about__body">
      <span class="about__name" id="aboutName">Chris H.</span>
      <div class="about__bio">
        <p id="bioZh"></p>
        <p id="bioEn"></p>
      </div>
      <div class="about__links" id="aboutLinks"></div>
    </div>
    <img class="about__portrait" id="aboutPortrait" src="" alt="" hidden>
  </div>
  <button class="overlay__close" id="aboutClose" type="button">CLOSE</button>
</div>

<script src="assets/app.js" defer></script>
</body>
</html>
